# evidence.yaml
# 统一证据对象。所有需要"已验证"结论的 Skill 必须用本对象记录证据，
# 不得用"无异常""已验证"等无来源表述代替。

schema_version: "1.0"

evidence:
  # 证据唯一标识
  id: string
  # 证据类型：fact / manager_claim / inference / judgment / action
  type: string
  # 证据来源（文件、数据库、人物、文档路径、URL 等）
  source: string
  # 证据在来源中的位置（章节、行号、表名、字段名）
  location: string
  # 观察到的原始内容或事实
  observed: string
  # 信息截止/观察时间点
  as_of: string
  # 证据强度：A（强）/ B（中）/ C（弱）/ unknown
  evidence_strength: string
  # 本证据支持哪些结论（引用结论 id）
  supports: []
  # 本证据与哪些结论冲突（引用结论 id）
  contradicts: []
  # 尚未解决的分歧或待补信息
  unresolved: []

# 类型语义约束（各 Skill 不得违反）
type_rules:
  fact:
    rule: 事实只描述可被独立复核的观察，不包含判断。fact 不能直接等同于 judgment。
  manager_claim:
    rule: 管理人/受访者陈述必须保留其来源身份（谁、何时、在哪次尽调/路演中说的），不得降级为匿名事实。
  inference:
    rule: 推理必须说明推理依据（从哪些事实/前提推出），并标注该依据的强度和缺口。
  judgment:
    rule: 判断必须能够追溯到支撑它的证据（supports 非空），无法追溯的判断不得标为已验证。
  action:
    rule: 行动建议必须说明适用条件（在什么前提、什么状态下才执行），否则只能记为待定。

# 证据不足的统一表达
insufficient_evidence:
  # 证据不足时使用本标记，不能用"无异常""未见异常"代替
  marker: insufficient_evidence
  rule: 当关键字段缺失、来源不可复核或证据强度为 unknown 时，结论必须标记为 insufficient_evidence 或 conflict。
  conflict_marker: conflict
  conflict_rule: 当两条证据互相矛盾且无法裁定优先级时，标记为 conflict，不得静默选边。

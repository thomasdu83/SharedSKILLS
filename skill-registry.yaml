    aliases:
      - research-monitor
      - monitor-contracting
    version: "1.0.0"
    status: active
    role: primary
    routable: true

  - id: frontend-page-router
    path: frontend-page-router
    layer: router
    priority: 80
    triggers:
      - 创建或修改金融研究前端且需要判断工作台与报告页模式
    excludes: []

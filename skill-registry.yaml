  - id: cicc-research-analyst-kevin-skill
    path: cicc-research-analyst-kevin-skill
    layer: domain
    priority: 90
    triggers:
      - 用户点名Kevin/刘刚，或明确要求港股、中概股、海外市场、全球资产配置的中金分析师视角
    excludes: []
    escalates_to: []
    supports: []
    dependencies: [cicc-research-gateway]
    required_contracts: [shared-contracts/evidence.yaml, shared-contracts/execution.yaml]

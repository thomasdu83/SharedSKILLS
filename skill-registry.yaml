      - ai-quant-development-router
    supports: []
    dependencies: []
    required_contracts:
      - shared-contracts/evidence.yaml
      - shared-contracts/artifact.yaml
      - shared-contracts/execution.yaml
      - shared-contracts/route-decision.yaml
    outputs:
      - source_claims
      - logic_cards
      - monitoring_rules
      - evidence_specs
      - data_gaps
      - logic_evidence_snapshots
      - handoff_contract
      - user_decisions_required

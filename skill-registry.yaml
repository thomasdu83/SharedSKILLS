  - id: systematic-debugging
    path: systematic-debugging
    layer: engineering
    priority: 83
    triggers:
      - 出现 bug、失败测试、集成异常或性能问题，需要根因分析
    excludes: [ai-quant-development-router]
    escalates_to: [quant-develop]

    aliases: [fund-wiki-ingest]
    version: "1.0.0"
    status: active
    role: primary
    routable: true

  - id: wisdom-manager-product-research
    path: wisdom-manager-product-research
    layer: domain
    priority: 42
    triggers:
      - 查询私募管理人、产品要素、合同条款或产品净值
    excludes: [fund-wiki-research]
    escalates_to: [fund-wiki-research]
    supports: []
    dependencies: [fund-wiki-runtime]
    required_contracts: [shared-contracts/evidence.yaml, shared-contracts/execution.yaml]
    outputs: [事实结果, source_status, ambiguity]
    aliases: [fund-product-facts]
    version: "1.0.0"
    status: active
    role: primary
    routable: true

  - id: public-data-collector
    path: public-data-collector
    layer: domain
    priority: 43
    triggers:
      - 内部 DBSource 与 zmdata 均无数据时采集公开免费数据源
    excludes: [zmdata-data-api]
    escalates_to: [quant-develop]
    supports: []
    dependencies: [public-data-network]
    required_contracts: [shared-contracts/data-freshness.yaml, shared-contracts/evidence.yaml, shared-contracts/execution.yaml]
    outputs: [series_contract, source_url, fetched_at]
    aliases: [public-data]
    version: "1.0.0"
    status: active
    role: primary
    routable: true

  - id: research-monitor-contracting
    path: research-monitor-contracting
    layer: domain
    priority: 84
    triggers:
      - 将研究报告、论文或研究方案转换为可追溯的因子/指标监控合同
      - 从研究主张提炼逻辑卡片、证据指标、监控规则和数据缺口
      - 为后续 QuantSystem 因子监控项目准备结构化 handoff contract
    excludes:
      - quant-research-coding        # 不负责一次性计算或因子代码原型
      - quant-develop                # 不负责正式项目工程实现

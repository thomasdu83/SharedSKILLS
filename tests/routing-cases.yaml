# routing-cases.yaml
# SharedSKILLS 路由测试案例。
# 用途：人工/脚本审阅路由是否正确，防止主入口竞争与越界。
# 本文件是契约测试的输入，不驱动生产路由。

schema_version: "1.0"

positive_cases:
  - name: 页面维护主入口
    input: 做一个基金池维护平台
    expected_primary: frontend-page-router
    expected_supports: [frontend-ops-platform]
    reason: 独立页面按内部操作任务选择模式
  - name: 旧前端入口归一
    input: 用 frontend-design 把现有已验证回测排成静态HTML，不重算
    expected_primary: frontend-page-router
    expected_supports: [frontend-report-page]
    forbidden_primary: quant-research-coding
    reason: 兼容名称归一，纯展示不启动研究计算
  - name: 架构图唯一入口
    input: 画云服务架构图，旧流程叫 architecture-diagram
    expected_primary: archify
    reason: 旧架构图入口归一
  - name: 论文新模型只有一个总控
    input: 按论文实现全新动量模型，后续每天运行
    expected_primary: ai-quant-development-router
    expected_supports: [investment-paper-replication]
    reason: 新开发优先，来源方法辅助，工程化在后续阶段转交
  - name: 只审读论文
    input: 只审读论文并列出可复现性缺口，不写代码
    expected_primary: investment-paper-replication
    reason: 来源审读不启动新模型流程
  - name: 研究材料转监控合同
    input: 将研究报告提炼为可追溯的因子监控合同，并交给 QuantSystem 落地
    expected_primary: research-monitor-contracting
    expected_escalation: ai-quant-development-router
    reason: 先完成研究合同，再交接量化开发路由
  - name: Kevin点名咨询
    input: Kevin怎么看港股
    expected_primary: cicc-research-analyst-kevin-skill
    reason: 点名一次性咨询不进入宏观快照
  - name: 李求索点名咨询
    input: 李求索怎么看A股行业配置
    expected_primary: cicc-research-analyst-lqs-skill
    reason: 角色意图明确
  - name: 李昭点名咨询
    input: 李昭怎么看黄金
    expected_primary: cicc-research-analyst-lz-skill
    reason: 角色意图明确
  - name: 缪延亮点名咨询
    input: 缪延亮怎么看全球通胀
    expected_primary: cicc-research-analyst-myl-skill
    reason: 角色意图明确
  - name: 韦璐璐点名咨询
    input: 韦璐璐怎么看中国债市流动性
    expected_primary: cicc-research-analyst-wll-skill
    reason: 角色意图明确
  - name: 周彭点名咨询
    input: 周彭怎么看中国产业政策传导
    expected_primary: cicc-research-analyst-zp-skill
    reason: 角色意图明确
  - name: 中金黄金视角默认专题
    input: 用中金观点分析黄金，未点名分析师
    expected_primary: cicc-research-analyst-lz-skill
    reason: 明确中金视角，按最具体专题只选一位
  - name: 周度预测可以引用分析师
    input: 做本周情景概率并冻结预测快照，顺带参考刘刚观点
    expected_primary: macro-strategy-learning
    expected_supports: [cicc-research-analyst-kevin-skill]
    reason: 主交付物是预测快照，分析师只是来源
  - name: 产品合同事实查询
    input: 查询私募产品合同条款
    expected_primary: wisdom-manager-product-research
    reason: 事实查询不启动研究综合
  - name: 三家管理人材料入库
    input: 将三家管理人的尽调材料存入 fund-wiki
    expected_primary: fund-wiki
    reason: 入库不启动研究综合
  - name: 孤立脚本故障
    input: 排查这个脚本的孤立bug
    expected_primary: systematic-debugging
    reason: 仅调试，未授权新模型开发
  - name: 普通概念无需远程角色
    input: 黄金涨跌影响因素有哪些
    forbidden_primary: macro-strategy-learning
    forbidden_action: 自动调用远程分析师或生成周度快照
    expected_action: 直接解释概念，按需查证，无需核心路由记录
    reason: 没有中金来源或持久机制框架需求
  - name: 一次性取数或快速因子检查
    input: 用户要求快速拉取某因子数据并做单次检查
    expected_primary: quant-research-coding
    expected_supports: []
    reason: Level 1/2 轻量研究，不进入正式工程
  - name: 重复运行并进入投资流程
    input: 用户要求把已证明价值的回测固化为每周运行并输出给投委会
    expected_primary: quant-develop
    expected_supports: []
    reason: 重复运行 + 投资流程消费，需 project.yaml / registry / preflight
  - name: 新策略或新模型开发
    input: 用户要求新建一个量化策略模型
    expected_primary: ai-quant-development-router
    expected_supports: []
    reason: 新量化开发主入口，先路由再实现
  - name: 基于 fund-wiki 的比较研究
    input: 用户要求做管理人可比池研究并核验 claim 与 fund facts
    expected_primary: fund-wiki-research
    expected_supports: []
    reason: fund-wiki 研究综合，事实层/研究层分离
  - name: 周度宏观判断或预测复盘
    input: 用户要求更新周度宏观情景概率并复盘上周预测
    expected_primary: macro-strategy-learning
    expected_supports: []
    reason: 宏观判断与预测快照，接入 forecast 契约
  - name: 项目完成后的经验复盘
    input: 用户要求复盘刚完成的项目并提取可复用规则
    expected_primary: project-retrospective
    expected_supports: []
    reason: 经验复盘与回写提案，不直接改共享 Skill

boundary_cases:
  - name: 一次性研究不能自动升级为 quant-develop
    input: 用户只要求做一次因子检查，无重复运行/共享消费意图
    forbidden_primary: quant-develop
    expected_primary: quant-research-coding
    reason: 没有升级信号，不得默认项目化
  - name: 正式模型不能降级为临时脚本
    input: 已是 production 的模型做修改，不得退回一次性脚本
    forbidden_primary: quant-research-coding
    expected_primary: quant-develop
    reason: 正式模型改动须走工程契约与晋级记录
  - name: 研究报告不能直接修改事实层
    input: 研究结论与 product_profiles 冲突
    forbidden_action: 直接写回 product_profiles / manager_profiles
    expected_action: 生成 review output，标记 conflict 或 insufficient_evidence
    reason: 研究层不得覆盖事实层
  - name: 宏观预测不能替代组合执行记录
    input: 用户要求把宏观 stance 落到组合
    forbidden_primary: macro-strategy-learning
    expected_primary: quant-develop
    reason: 组合执行/权重落地属于工程层，不属于宏观判断层
  - name: 项目复盘不能自动修改共享 Skill
    input: 复盘提出改进某个共享 Skill
    forbidden_action: 直接修改共享 Skill
    expected_action: 生成回写提案，人工确认后另行执行
    reason: 经验回写必须留人，不得自动落地
